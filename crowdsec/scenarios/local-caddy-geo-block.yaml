type: leaky
name: local/caddy-geo-block
description: "Ban IPs hitting Caddy from countries outside the allowed list"
filter: "evt.Meta.log_type in ['http_access-log', 'http_error-log'] && evt.Meta.source_ip != '' && evt.Enriched.IsoCode != '' && evt.Enriched.IsoCode not in ['UY', 'AR']"
groupby: evt.Meta.source_ip
capacity: 1
leakspeed: 1m
blackhole: 2m
labels:
  confidence: 3
  spoofable: 0
  behavior: "http:geo-block"
  service: http
  remediation: true

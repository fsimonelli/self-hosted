name: local/ntfy-whitelist
description: "Whitelist normal ntfy web UI and subscription traffic"
filter: "evt.Meta.service == 'http' && evt.Meta.log_type in ['http_access-log', 'http_error-log'] && evt.Meta.target_fqdn == 'hermes.elliflix.opik.net'"
whitelist:
  reason: "normal ntfy app traffic"
  expression:
    - evt.Meta.http_status in ['200', '304', '499'] && evt.Meta.http_verb in ['GET', 'HEAD'] && evt.Meta.http_path in ['/', '/app.html', '/config.js', '/sw.js', '/v1/config']
    - evt.Meta.http_status in ['200', '304', '404', '499'] && evt.Meta.http_verb == 'GET' && evt.Meta.http_path matches '^/(static/(css|fonts|images|langs|media)/.*|manifest\\.webmanifest|favicon\\.ico|favicon\\.png|robots\\.txt)$'
    - evt.Meta.http_status in ['200', '304', '499'] && evt.Meta.http_verb == 'GET' && evt.Meta.http_path matches '^/[A-Za-z0-9_-]+/(auth|json|sse|ws)$'

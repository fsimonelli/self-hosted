name: local/antel-asn-whitelist
description: "Whitelist non-static Caddy traffic from AS6057 (ANTEL)"
filter: "evt.Meta.service == 'http' && evt.Meta.log_type in ['http_access-log', 'http_error-log']"
whitelist:
  reason: "AS6057 allowlist for non-static Caddy requests"
  expression:
    - evt.Enriched.ASNNumber == '6057' && evt.Parsed.static_ressource == 'false'

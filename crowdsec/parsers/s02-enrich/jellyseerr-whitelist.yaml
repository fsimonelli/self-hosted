name: local/jellyseerr-whitelist
description: "Whitelist normal Jellyseerr browsing API calls"
filter: "evt.Meta.service == 'http' && evt.Meta.log_type in ['http_access-log', 'http_error-log'] && evt.Meta.target_fqdn == 'iris.elliflix.opik.net'"
whitelist:
  reason: "normal Jellyseerr API browsing"
  expression:
    - evt.Meta.http_status in ['200', '304', '499'] && evt.Parsed.static_ressource == 'false' && evt.Meta.http_verb == 'GET' && evt.Meta.http_path matches '^/api/v1/(movie|tv|request)/[0-9]+$'

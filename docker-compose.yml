services:

  dozzle:
    container_name: dozzle
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${CONFIG_ROOT}/dozzle/data:/data
    ports:
      - "8085:8080"
    restart: unless-stopped
    networks:
      - media

  beszel:
    container_name: beszel
    image: henrygd/beszel:latest
    environment:
      - APP_URL=${BESZEL_APP_URL:-http://localhost:8090}
    volumes:
      - ${CONFIG_ROOT}/beszel/data:/beszel_data
      - ${CONFIG_ROOT}/beszel/socket:/beszel_socket
    ports:
      - "127.0.0.1:${BESZEL_PORT:-8090}:8090"
    restart: unless-stopped
    networks:
      - media

  beszel-agent:
    container_name: beszel-agent
    image: henrygd/beszel-agent:latest
    profiles:
      - beszel-agent
    network_mode: host
    environment:
      - LISTEN=/beszel_socket/beszel.sock
      - HUB_URL=http://localhost:${BESZEL_PORT:-8090}
      - TOKEN=${BESZEL_AGENT_TOKEN:-}
      - KEY=${BESZEL_AGENT_KEY:-}
    volumes:
      - ${CONFIG_ROOT}/beszel/agent:/var/lib/beszel-agent
      - ${CONFIG_ROOT}/beszel/socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    depends_on:
      - beszel

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    volumes:
      - ${CONFIG_ROOT}/jellyfin/config:/config
      - ${CONFIG_ROOT}/jellyfin/cache:/cache
      - ${MEDIA_ROOT}:/media
      - ./jellyfin/enable-backdrops.sh:/usr/local/bin/enable-backdrops.sh:ro
    entrypoint: ["/usr/local/bin/enable-backdrops.sh"]
    environment:
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    ports:
      - "8096:8096"
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
    networks:
      - media

  jellyfin-usage:
    build: ./jellyfin-usage
    container_name: jellyfin-usage
    user: ${PUID}:${PGID}
    environment:
      - TZ=${TZ}
      - JELLYFIN_DB=/jellyfin-data/jellyfin.db
      - PLAYBACK_REPORTING_DB=/jellyfin-data/playback_reporting.db
      - STATE_DB=/data/jellyfin_usage.db
      - JELLYFIN_USAGE_PASSWORD=${JELLYFIN_USAGE_PASSWORD:-}
      - JELLYFIN_USAGE_MONTHLY_FEE=${JELLYFIN_USAGE_MONTHLY_FEE:-0}
      - JELLYFIN_USAGE_CURRENCY=${JELLYFIN_USAGE_CURRENCY:-USD}
      - JELLYFIN_USAGE_HISTORY_DAYS=${JELLYFIN_USAGE_HISTORY_DAYS:-90}
    volumes:
      - ${CONFIG_ROOT}/jellyfin/config/data:/jellyfin-data:ro
      - ${CONFIG_ROOT}/jellyfin-usage:/data
    ports:
      - "127.0.0.1:${JELLYFIN_USAGE_PORT:-8092}:8080"
    restart: unless-stopped
    depends_on:
      - jellyfin
    networks:
      - media

  meilisearch:
    container_name: meilisearch
    image: getmeili/meilisearch:v1.34
    restart: unless-stopped
    depends_on:
      - jellyfin
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - ${CONFIG_ROOT}/meilisearch/data:/meili_data
    ports:
      - 7700:7700
    networks:
    - media

  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped
    networks:
      - media

  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${MEDIA_ROOT}:/data
    ports:
      - "7878:7878"
    restart: unless-stopped
    depends_on:
      - prowlarr
    networks:
      - media

  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${MEDIA_ROOT}:/data
    ports:
      - "8989:8989"
    restart: unless-stopped
    depends_on:
      - prowlarr
    networks:
      - media

  bazarr:
    image: ghcr.io/lavx/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      - ${MEDIA_ROOT}:/data
    ports:
      - "6767:6767"
    restart: unless-stopped
    depends_on:
      - radarr
      - sonarr
    networks:
      - media
  
  opensubtitles-scraper:
    image: ghcr.io/lavx/opensubtitles-scraper:latest
    container_name: opensubtitles-scraper
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      flaresolverr:
        condition: service_healthy
    environment:
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    networks:
      - media

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
    ports:
      - "8191:8191"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8191/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    networks:
      - media

  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT}
    volumes:
      - ${CONFIG_ROOT}/qbittorrent:/config
      - ${MEDIA_ROOT}:/data
    restart: unless-stopped
    depends_on:
      - protonvpn
    network_mode: "service:protonvpn"

  protonvpn:
    image: docker.io/qmcgaw/gluetun:latest
    container_name: protonvpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - VPN_PORT_FORWARDING=${VPN_PORT_FORWARDING}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c '/usr/bin/wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORT}}}" http://127.0.0.1:${QBITTORRENT_WEBUI_PORT}/api/v2/app/setPreferences 2>&1'
      - VPN_PORT_FORWARDING_DOWN_COMMAND=/bin/sh -c '/usr/bin/wget -O- --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo"}" http://127.0.0.1:${QBITTORRENT_WEBUI_PORT}/api/v2/app/setPreferences 2>&1'
    volumes:
      - ./vpn:/gluetun
    ports:
      - "${QBITTORRENT_WEBUI_PORT}:${QBITTORRENT_WEBUI_PORT}"
    restart: unless-stopped
    networks:
      - media
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: jellyseerr
    init: true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/jellyseerr:/app/config
    ports:
      - "5055:5055"
    restart: unless-stopped
    depends_on:
      - radarr
      - sonarr
      - jellyfin
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    networks:
      - media

  duplicati:
    image: linuxserver/duplicati:latest
    container_name: duplicati
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
      - SETTINGS_ENCRYPTION_KEY=${DUPLICATI_ENCRYPTION_KEY}
      - DUPLICATI__WEBSERVICE_PASSWORD=${DUPLICATI_WEBSERVICE_PASSWORD}
    volumes:
      - ${CONFIG_ROOT}/duplicati:/config
      - ${CONFIG_ROOT}:/source/config:ro
      - ${MEDIA_ROOT}:/source/media:ro
      - ./backups:/backups
    ports:
      - "8200:8200"
    restart: unless-stopped
    networks:
      - media
  
  profilarr:
        image: santiagosayshey/profilarr:latest
        container_name: profilarr
        ports:
            - 6868:6868
        volumes:
            - ${CONFIG_ROOT}/profilarr:/config
        environment:
            - TZ=${TZ}
        restart: unless-stopped
        networks:
          - media

  hbbs:
    container_name: hbbs
    image: rustdesk/rustdesk-server:latest
    command: hbbs
    volumes:
      - ${CONFIG_ROOT}/rustdesk/data:/root
    network_mode: "host"
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: hbbr
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    volumes:
      - ${CONFIG_ROOT}/rustdesk/data:/root
    network_mode: "host"
    restart: unless-stopped

  ntfy:
    image: binwiederhier/ntfy
    container_name: ntfy
    command:
      - serve
    environment:
      - TZ=${TZ}
      - NTFY_BASE_URL=${NTFY_BASE_URL}
      - NTFY_UPSTREAM_BASE_URL=${NTFY_UPSTREAM_BASE_URL}
      - NTFY_UPSTREAM_ACCESS_TOKEN=${NTFY_UPSTREAM_ACCESS_TOKEN}
      - NTFY_LOG_LEVEL=${NTFY_LOG_LEVEL}
    user: ${PUID}:${PGID}
    volumes:
      - ${CONFIG_ROOT}/ntfy/cache:/var/cache/ntfy
      - ${CONFIG_ROOT}/ntfy/config:/etc/ntfy
    ports:
      - "127.0.0.1:8089:80"
    healthcheck:
        test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
        interval: 60s
        timeout: 10s
        retries: 3
        start_period: 40s
    restart: unless-stopped
    init: true
    networks:
      - media
  
  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    restart: unless-stopped
    ports:
      - "11011:11011"
    volumes:
      - ${CONFIG_ROOT}/cleanuparr:/config
      - ${MEDIA_ROOT}:/data
    environment:
      - PORT=11011
      - BASE_PATH=
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11011/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      - radarr
      - sonarr
      - prowlarr
      - qbittorrent
      - ntfy
    networks:
      - media

  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:latest
    container_name: maintainerr
    volumes:
      - ${CONFIG_ROOT}/maintainerr/data:/opt/data
    environment:
      - TZ=${TZ}
    ports:
      - 6246:6246
    restart: unless-stopped
    networks:
      - media
    profiles: ["optional"]

  cross-seed:
    image: ghcr.io/cross-seed/cross-seed:6
    container_name: cross-seed
    user: ${PUID}:${PGID}
    ports:
      - "2468:2468"
    volumes:
      - ${CONFIG_ROOT}/cross-seed:/config
      - ${MEDIA_ROOT}:/data
    environment:
      - RADARR_API_KEY=${RADARR_API_KEY}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - QBITTORRENT_USERNAME=${QBITTORRENT_USERNAME}
      - QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD}
      - PROWLARR_API_KEY=${PROWLARR_API_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - sleep 60; cross-seed clear-indexer-failures || true; exec cross-seed daemon
    restart: unless-stopped
    networks:
      - media
    depends_on:
      - radarr
      - sonarr
      - qbittorrent
      - prowlarr

  calibre:
    image: ghcr.io/linuxserver/calibre:version-v8.6.0
    container_name: calibre
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/calibre/config:/config
      - ${MEDIA_ROOT}:/data
    ports:
      - 7384:8080
      - 7385:8081
      - 9090:9090
    restart: unless-stopped
    networks:
      - media

  shelfmark:
    image: ghcr.io/calibrain/shelfmark:latest
    container_name: shelfmark
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT}
      - EMAIL_SMTP_SECURITY=${EMAIL_SMTP_SECURITY}
      - EMAIL_SMTP_USERNAME=${EMAIL_SMTP_USERNAME}
      - EMAIL_SMTP_PASSWORD=${EMAIL_SMTP_PASSWORD}
      - EMAIL_SMTP_SUBJECT_TEMPLATE=${EMAIL_SMTP_SUBJECT_TEMPLATE}
    ports:
      - 8084:8084
    restart: unless-stopped
    volumes:
      - ${MEDIA_ROOT}:/data
      - ${CONFIG_ROOT}/shelfmark:/config
    networks:
      - media

  caddy:
    image: caddy:2
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CONFIG_ROOT}/caddy/data:/data
      - ${CONFIG_ROOT}/caddy/config:/config
    environment:
      - ACME_EMAIL=${ACME_EMAIL}
      - JELLYFIN_DOMAIN=${JELLYFIN_DOMAIN}
      - JELLYSEERR_DOMAIN=${JELLYSEERR_DOMAIN}
      - SHELFMARK_DOMAIN=${SHELFMARK_DOMAIN}
    restart: unless-stopped
    depends_on:
      - jellyfin
      - jellyseerr
      - shelfmark
    networks:
      - media

  ddclient:
    image: linuxserver/ddclient:latest
    container_name: ddclient
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/ddclient:/config
    restart: unless-stopped

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    ports:
      - "127.0.0.1:8087:8080"
    environment:
      - TZ=${TZ}
      - COLLECTIONS=crowdsecurity/caddy crowdsecurity/http-cve crowdsecurity/whitelist-good-actors
      - PARSERS=crowdsecurity/docker-logs crowdsecurity/geoip-enrich
      - BOUNCER_KEY_firewall=${CROWDSEC_BOUNCER_KEY}
    volumes:
      - ${CONFIG_ROOT}/crowdsec/etc:/etc/crowdsec
      - ${CONFIG_ROOT}/crowdsec/data:/var/lib/crowdsec/data
      - ./crowdsec/acquis.d/caddy.yaml:/etc/crowdsec/acquis.d/caddy.yaml:ro
      - ./crowdsec/scenarios/local-caddy-geo-block.yaml:/etc/crowdsec/scenarios/local-caddy-geo-block.yaml:ro
      - ./crowdsec/parsers/s02-enrich/local-whitelist.yaml:/etc/crowdsec/parsers/s02-enrich/local-whitelist.yaml:ro
      - ./crowdsec/parsers/s02-enrich/antel-whitelist.yaml:/etc/crowdsec/parsers/s02-enrich/zz-antel-whitelist.yaml:ro
      - ./crowdsec/parsers/s02-enrich/jellyfin-enhanced-whitelist.yaml:/etc/crowdsec/parsers/s02-enrich/zz-jellyfin-enhanced-whitelist.yaml:ro
      - ./crowdsec/parsers/s02-enrich/jellyseerr-whitelist.yaml:/etc/crowdsec/parsers/s02-enrich/jellyseerr-whitelist.yaml:ro
      - ./crowdsec/parsers/s02-enrich/shelfmark-whitelist.yaml:/etc/crowdsec/parsers/s02-enrich/shelfmark-whitelist.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - caddy
    restart: unless-stopped
    networks:
      - media

networks:
  media:
    driver: bridge
